services:
  db:
    image: postgres:16-alpine
    container_name: repopulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: repopulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - repopulse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repopulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repopulse-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@db:5432/repopulse
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  repopulse-pgdata:
