<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" id="theme-color-meta" />
    <script>
      (function () {
        var key = 'repopulse-theme';
        var stored = localStorage.getItem(key);
        var root = document.documentElement;
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (stored === 'light') {
          root.setAttribute('data-theme', 'light');
          root.classList.remove('dark');
        } else if (stored === 'dark') {
          root.setAttribute('data-theme', 'dark');
          root.classList.add('dark');
        } else {
          root.removeAttribute('data-theme');
          if (dark) root.classList.add('dark');
          else root.classList.remove('dark');
        }
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', dark ? '#101827' : '#f5f7fb');
      })();
    </script>
    <title>RepoPulse - GitHub Repository Ledger & Triage</title>
    <link rel="icon" type="image/svg+xml" href="/repopulse-mark.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/repopulse-mark.svg" />
    <meta name="description" content="A quiet ledger for GitHub developers to keep track of repository activity, cooling projects, and triage decisions." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
